<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Medicamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --f7-theme-color: #000;
            --f7-bars-bg-color: rgba(247,247,247,0.98);
            --f7-bars-text-color: #000;
            --f7-bars-border-color: rgba(0,0,0,0.1);
            --f7-list-bg-color: #fff;
            --f7-list-item-title-text-color: #000;
            --f7-list-item-divider-bg-color: rgba(0,0,0,0.05);
            --f7-list-item-border-color: rgba(0,0,0,0.1);
            --f7-button-text-color: #000;
            --f7-button-bg-color: transparent;
            --f7-button-border-color: #000;
            --f7-modal-bg-color: #fff;
            --f7-modal-text-color: #000;
        }
        body {
            font-family: -apple-system, SF Pro Text, SF UI Text, system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #000;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: var(--f7-bars-bg-color);
            color: var(--f7-bars-text-color);
            height: 44px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid var(--f7-bars-border-color);
        }
        .page-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
            background-color: #f7f7f7;
        }
        .list {
            margin: 0;
            padding: 0;
            list-style: none;
            background: var(--f7-list-bg-color);
        }
        .list-item {
            padding: 16px;
            background-color: var(--f7-list-bg-color);
            border-bottom: 1px solid var(--f7-list-item-border-color);
        }
        .list-item-title {
            font-size: 17px;
            font-weight: 400;
            color: var(--f7-list-item-title-text-color);
        }
        .list-item-after {
            font-size: 15px;
            color: #8e8e93;
        }
        .toolbar {
            background-color: var(--f7-bars-bg-color);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            position: sticky;
            bottom: 0;
            border-top: 1px solid var(--f7-bars-border-color);
        }
        .toolbar-button {
            color: var(--f7-button-text-color);
            background-color: var(--f7-button-bg-color);
            border: 1px solid var(--f7-button-border-color);
            border-radius: 10px;
            padding: 7px 16px;
            font-size: 14px;
            font-weight: 400;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        .searchbar {
            background: #e4e4e4;
            border-radius: 10px;
            margin: 8px 16px;
            height: 36px;
            padding: 0 8px;
            display: flex;
            align-items: center;
        }
        .searchbar input {
            border: none;
            background: transparent;
            width: 100%;
            height: 100%;
            font-size: 17px;
            outline: none;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-inner {
            background: var(--f7-modal-bg-color);
            border-radius: 13px;
            width: 280px;
            padding: 16px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
        }
        .list-input {
            margin-bottom: 16px;
        }
        .list-input input {
            width: 100%;
            height: 36px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 0 8px;
            font-size: 16px;
        }
        .button {
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="navbar">
            Gerenciador de Medicamentos
        </div>
        <div class="page-content">
            <div class="searchbar">
                <input type="text" id="searchInput" placeholder="Buscar medicamentos...">
            </div>
            <ul class="list" id="medicamentosList">
            </ul>
        </div>
        <div class="toolbar">
            <a href="#" id="addMedicamentoBtn" class="toolbar-button">Adicionar</a>
        </div>
    </div>

    <div class="modal fade" id="medicamentoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Adicionar Medicamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="medicamentoForm">
                        <input type="hidden" id="medicamentoId">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <input type="text" class="form-control" id="categoria" required>
                        </div>
                        <div class="mb-3">
                            <label for="dataVencimento" class="form-label">Data de Vencimento</label>
                            <input type="date" class="form-control" id="dataVencimento" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <script>
        let db;
        const dbName = 'MedicamentosDB';
        const dbVersion = 1;
        const request = indexedDB.open(dbName, dbVersion);

        request.onerror = (event) => {
            console.error("Erro ao abrir o banco de dados:", event.target.error);
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            carregarMedicamentos();
        };

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            const objectStore = db.createObjectStore('medicamentos', { keyPath: 'id', autoIncrement: true });
            objectStore.createIndex('nome', 'nome', { unique: false });
            objectStore.createIndex('categoria', 'categoria', { unique: false });
            objectStore.createIndex('dataVencimento', 'dataVencimento', { unique: false });
        };

        function adicionarMedicamento(medicamento) {
            const transaction = db.transaction(['medicamentos'], 'readwrite');
            const objectStore = transaction.objectStore('medicamentos');
            const request = objectStore.add(medicamento);

            request.onsuccess = () => {
                alert('Medicamento adicionado com sucesso!');
                document.getElementById('medicamentoModal').classList.remove('show');
                carregarMedicamentos();
            };

            request.onerror = () => {
                alert('Erro ao adicionar medicamento');
            };
        }

        function atualizarMedicamento(medicamento) {
            const transaction = db.transaction(['medicamentos'], 'readwrite');
            const objectStore = transaction.objectStore('medicamentos');
            const request = objectStore.put(medicamento);

            request.onsuccess = () => {
                alert('Medicamento atualizado com sucesso!');
                document.getElementById('medicamentoModal').classList.remove('show');
                carregarMedicamentos();
            };

            request.onerror = () => {
                alert('Erro ao atualizar medicamento');
            };
        }

        function excluirMedicamento(id) {
            const transaction = db.transaction(['medicamentos'], 'readwrite');
            const objectStore = transaction.objectStore('medicamentos');
            const request = objectStore.delete(id);

            request.onsuccess = () => {
                alert('Medicamento excluído com sucesso!');
                carregarMedicamentos();
            };

            request.onerror = () => {
                alert('Erro ao excluir medicamento');
            };
        }

        function carregarMedicamentos() {
            const medicamentosList = document.getElementById('medicamentosList');
            medicamentosList.innerHTML = '';

            const objectStore = db.transaction('medicamentos').objectStore('medicamentos');
            objectStore.openCursor().onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    const li = document.createElement('li');
                    li.className = 'list-item';
                    li.innerHTML = `
                        <div class="list-item-title">${cursor.value.nome}</div>
                        <div class="list-item-after">${cursor.value.categoria} - Vence: ${cursor.value.dataVencimento}</div>
                        <div class="list-item-actions">
                            <button class="edit-btn" data-id="${cursor.value.id}">Editar</button>
                            <button class="delete-btn" data-id="${cursor.value.id}">Excluir</button>
                        </div>
                    `;
                    medicamentosList.appendChild(li);
                    cursor.continue();
                }
            };
        }

        document.getElementById('addMedicamentoBtn').addEventListener('click', () => {
            document.getElementById('medicamentoId').value = '';
            document.getElementById('medicamentoForm').reset();
            document.getElementById('modalTitle').textContent = 'Adicionar Medicamento';
            document.getElementById('medicamentoModal').classList.add('show');
        });

        document.getElementById('medicamentoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('medicamentoModal')) {
                document.getElementById('medicamentoModal').classList.remove('show');
            }
        });

        document.getElementById('medicamentosList').addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-btn')) {
                const id = parseInt(e.target.getAttribute('data-id'));
                editarMedicamento(id);
            } else if (e.target.classList.contains('delete-btn')) {
                const id = parseInt(e.target.getAttribute('data-id'));
                if (confirm('Tem certeza que deseja excluir este medicamento?')) {
                    excluirMedicamento(id);
                }
            }
        });


        document.getElementById('medicamentoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('medicamentoId').value;
            const medicamento = {
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                dataVencimento: document.getElementById('dataVencimento').value
            };

            if (id) {
                medicamento.id = parseInt(id);
                atualizarMedicamento(medicamento);
            } else {
                adicionarMedicamento(medicamento);
            }
        });

        function editarMedicamento(id) {
            const transaction = db.transaction(['medicamentos'], 'readonly');
            const objectStore = transaction.objectStore('medicamentos');
            const request = objectStore.get(id);

            request.onsuccess = (event) => {
                const medicamento = event.target.result;
                document.getElementById('medicamentoId').value = medicamento.id;
                document.getElementById('nome').value = medicamento.nome;
                document.getElementById('categoria').value = medicamento.categoria;
                document.getElementById('dataVencimento').value = medicamento.dataVencimento;
                document.getElementById('modalTitle').textContent = 'Editar Medicamento';
                document.getElementById('medicamentoModal').classList.add('show');
            };
        }

        document.getElementById('darkModeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const medicamentosList = document.getElementById('medicamentosList');
            const items = medicamentosList.getElementsByClassName('list-item');

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const text = item.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then((registration) => {
                    console.log('Service Worker registrado com sucesso:', registration);
                })
                .catch((error) => {
                    console.log('Falha ao registrar o Service Worker:', error);
                });
        }

        // Verificar medicamentos vencidos
        function verificarMedicamentosVencidos() {
            const hoje = new Date();
            const objectStore = db.transaction('medicamentos').objectStore('medicamentos');
            objectStore.openCursor().onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    const dataVencimento = new Date(cursor.value.dataVencimento);
                    const diasParaVencer = Math.ceil((dataVencimento - hoje) / (1000 * 60 * 60 * 24));

                    if (diasParaVencer <= 30 && diasParaVencer > 0) {
                        Swal.fire('Alerta', `O medicamento ${cursor.value.nome} vencerá em ${diasParaVencer} dias.`, 'warning');
                    } else if (diasParaVencer <= 0) {
                        Swal.fire('Alerta', `O medicamento ${cursor.value.nome} está vencido!`, 'error');
                    }
                    cursor.continue();
                }
            };
        }

        // Verificar medicamentos vencidos ao carregar a página e a cada 24 horas
        verificarMedicamentosVencidos();
        setInterval(verificarMedicamentosVencidos, 24 * 60 * 60 * 1000);

        // Exportar dados
        function exportarDados() {
            const objectStore = db.transaction('medicamentos').objectStore('medicamentos');
            const medicamentos = [];

            objectStore.openCursor().onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    medicamentos.push(cursor.value);
                    cursor.continue();
                } else {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(medicamentos));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "medicamentos_backup.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                }
            };
        }

        // Importar dados
        function importarDados(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const medicamentos = JSON.parse(event.target.result);
                const transaction = db.transaction(['medicamentos'], 'readwrite');
                const objectStore = transaction.objectStore('medicamentos');

                medicamentos.forEach((medicamento) => {
                    objectStore.put(medicamento);
                });

                transaction.oncomplete = () => {
                    Swal.fire('Sucesso', 'Dados importados com sucesso!', 'success');
                    carregarMedicamentos();
                };
            };
            reader.readAsText(file);
        }

        // Adicionar botões de exportar e importar
        const exportarBtn = document.createElement('button');
        exportarBtn.textContent = 'Exportar Dados';
        exportarBtn.classList.add('btn', 'btn-secondary', 'ms-2');
        exportarBtn.addEventListener('click', exportarDados);
        document.getElementById('addMedicamentoBtn').insertAdjacentElement('afterend', exportarBtn);

        const importarBtn = document.createElement('button');
        importarBtn.textContent = 'Importar Dados';
        importarBtn.classList.add('btn', 'btn-secondary', 'ms-2');
        importarBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';

            input.onchange = (e) => {
                const file = e.target.files[0];
                importarDados(file);
            };
            input.click();
        });
        exportarBtn.insertAdjacentElement('afterend', importarBtn);
    </script>
</body>

</html>
